# Arm and hand motion over MoveIt, loaded by g1_manipulation/launch/arm_motion.launch.py.
g1_arm_motion_server:
  ros__parameters:
    # Share of the joint_limits.yaml speeds every move runs at; a goal's `speed` scales it further.
    velocity_scaling: 0.3
    planning_time_s: 5.0
    planning_attempts: 3

    # MoveHand. The farthest from the shoulder a hand is sent, and the distance a pointing hand
    # stands from it. The 23-DOF arm reaches about 0.50 m to its hand tip.
    max_reach_m: 0.55
    point_reach_m: 0.40
    # IK is tried in this many orientations besides the hand's own, and the arm goes to the
    # solution nearest its pose now. A five-joint arm's solver ignores orientation.
    ik_orientations: 16
    ik_timeout_s: 0.05
    # The links a pointing arm's line starts at.
    left_shoulder: left_shoulder_pitch_link
    right_shoulder: right_shoulder_pitch_link
