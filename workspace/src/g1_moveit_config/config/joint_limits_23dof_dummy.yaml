# Velocity and acceleration limits for the 23-DOF G1, hand:=dummy. The arms as joint_limits.yaml
# explains: 0.8 rad/s and 2.0 rad/s^2, since they track on position-only gains with no gravity
# compensation. No hand joints.

joint_limits:
  left_shoulder_pitch_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  left_shoulder_roll_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  left_shoulder_yaw_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  left_elbow_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  left_wrist_roll_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_shoulder_pitch_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_shoulder_roll_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_shoulder_yaw_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  right_elbow_joint:
    has_velocity_limits: true
