# Velocity and acceleration limits for the 23-DOF G1, hand:=linkerbot_o6. The arms as joint_limits.yaml
# explains: 0.8 rad/s and 2.0 rad/s^2, since they track on position-only gains with no gravity
# compensation. The O6's six joints at 2.0 rad/s, under
# LinkerBotO6System's 3.0 slew clamp. The mimics get their parent's limit times their ratio (thumb tip
# 1.86, finger tips 0.89, the larger taken), since MoveIt times every joint a motion moves.

joint_limits:
  left_shoulder_pitch_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
  left_shoulder_roll_joint:
