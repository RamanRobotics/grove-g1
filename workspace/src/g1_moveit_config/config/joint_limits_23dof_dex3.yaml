# Velocity and acceleration limits for the 23-DOF G1, hand:=dex3. The arms as joint_limits.yaml
# explains: 0.8 rad/s and 2.0 rad/s^2, since they track on position-only gains with no gravity
# compensation. The Dex3 fingers as joint_limits.yaml:
# 2.0 rad/s, under G1Dex3System's 3.0 slew clamp.

joint_limits:
  left_shoulder_pitch_joint:
    has_velocity_limits: true
    max_velocity: 0.8
    has_acceleration_limits: true
    max_acceleration: 2.0
